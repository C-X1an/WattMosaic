<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="WattMosaic architecture">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B2239"/><stop offset="1" stop-color="#0F565A"/></linearGradient>
    <style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#0B2239}.box{fill:#F7FBFB;stroke:#9EDDD4;stroke-width:2}.a{stroke:#2A908B;stroke-width:3;fill:none;marker-end:url(#m)}</style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2A908B"/></marker>
  </defs>
  <rect width="1200" height="420" rx="24" fill="#F2F8F8"/>
  <text x="60" y="58" class="t" font-size="28" font-weight="700">WattMosaic inference architecture</text>
  <g>
    <rect class="box" x="55" y="120" width="190" height="150" rx="18"/>
    <text class="t" x="150" y="154" text-anchor="middle" font-size="20" font-weight="700">Input signals</text>
    <text class="t" x="150" y="187" text-anchor="middle" font-size="15">Building + calendar</text>
    <text class="t" x="150" y="214" text-anchor="middle" font-size="15">Weather + occupancy</text>
    <text class="t" x="150" y="241" text-anchor="middle" font-size="15">Previous usage</text>

    <rect class="box" x="320" y="120" width="200" height="150" rx="18"/>
    <text class="t" x="420" y="154" text-anchor="middle" font-size="20" font-weight="700">Feature layer</text>
    <text class="t" x="420" y="188" text-anchor="middle" font-size="15">Validation</text>
    <text class="t" x="420" y="215" text-anchor="middle" font-size="15">Context encoding</text>
    <text class="t" x="420" y="242" text-anchor="middle" font-size="15">Missingness mask</text>

    <rect x="595" y="85" width="235" height="220" rx="18" fill="url(#g)"/>
    <text x="712" y="124" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="white" font-size="20" font-weight="700">Domain-aware experts</text>
    <text x="712" y="162" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#CDEBE8" font-size="15">Energy core</text>
    <text x="712" y="190" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#CDEBE8" font-size="15">15 missing-sensor specialists</text>
    <text x="712" y="218" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#CDEBE8" font-size="15">Reference-domain adaptation</text>
    <text x="712" y="246" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#CDEBE8" font-size="15">Mask-based routing</text>
    <text x="712" y="274" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" fill="#91F5D4" font-size="14">portable tree inference</text>

    <rect class="box" x="910" y="120" width="225" height="150" rx="18"/>
    <text class="t" x="1022" y="158" text-anchor="middle" font-size="20" font-weight="700">Energy forecast</text>
    <text class="t" x="1022" y="194" text-anchor="middle" font-size="15">Continuous prediction</text>
    <text class="t" x="1022" y="223" text-anchor="middle" font-size="15">ID-aligned output</text>
    <text class="t" x="1022" y="252" text-anchor="middle" font-size="15">Robust to missing sensors</text>

    <path class="a" d="M245 195H314"/><path class="a" d="M520 195H589"/><path class="a" d="M830 195H904"/>
  </g>
  <text class="t" x="60" y="362" font-size="15" fill="#527477">Four sensor channels create 16 availability states; complete rows use the core directly, while incomplete rows are routed to specialized models.</text>
</svg>
